server {
    listen 80;
    server_name diagrampl.duckdns.org;
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name diagrampl.duckdns.org;

    # Rutas de los certificados generados por Certbot
    ssl_certificate /etc/letsencrypt/live/diagrampl.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diagrampl.duckdns.org/privkey.pem;

    # Opciones de seguridad recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Servir la página web
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy para la API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy para WebSockets
    location /ws-diagram/ {
        proxy_pass http://backend:8080/ws-diagram/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
