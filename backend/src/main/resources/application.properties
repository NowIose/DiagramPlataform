spring.application.name=backend
server.port=${PORT:8080}

# Configuración de conexión a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/diagramador_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:2077}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate (El ORM de Spring Boot)
# "update" creará o actualizará las tablas en la BD automáticamente basándose en tus futuras clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Muestra en la consola las consultas SQL que se ejecutan por detrás (muy útil para depurar)
spring.jpa.show-sql=true

# Configuración de JWT
jwt.secret=${JWT_SECRET:CLAVE_SUPER_SECRETA_DIAGRAMCONECT_2026_LOCAL_DEV_KEY}
jwt.expiration=${JWT_EXPIRATION:86400000}